openapi: 3.1.0
info:
  title: YoFacturo API
  version: 1.0.0
  summary: API pública de YoFacturo para integraciones programáticas (catálogo, ventas, facturación electrónica
    AFIP, clientes y más).
  description: "API REST para acceso programático a una cuenta de YoFacturo — facturación electrónica\
    \ AFIP, catálogo, ventas, clientes, cuenta corriente, contabilidad y automatizaciones vía webhooks\
    \ salientes.\n\n### Autenticación\nCada request se autentica con un token opaco (`X-API-Key: yf_live_xxx`\
    \ o `Authorization: Bearer yf_live_xxx`), generado desde **Configuración > API Tokens** en el panel.\
    \ Cada token lleva uno o más *scopes* (`recurso:read` / `recurso:write`) — el request falla con 403\
    \ si le falta el scope que ese endpoint requiere.\n\n### Modo sandbox (`yf_test_*`)\nUn token con\
    \ prefijo `yf_test_*` en lugar de `yf_live_*` autentica como el mismo tenant/usuario (mismo plan,\
    \ mismos permisos) pero cada lectura/escritura se enruta a una base de datos físicamente separada\
    \ (`{tenant}__sandbox`) que nunca toca los datos reales, y la emisión de comprobantes AFIP nunca sale\
    \ a la red: se persiste un comprobante simulado con un CAE sintético (`simulated: true`, `livemode:\
    \ false`). `POST /sandbox/reset/` vacía esa base de un saque para reiniciar una suite de integración\
    \ desde cero. Un token `yf_live_*` recibe 403 en ese endpoint — nunca puede alcanzar un drop de base\
    \ de datos por acá.\n\n### Reintentos seguros (Idempotency-Key)\nLos endpoints de creación con mayor\
    \ costo de un duplicado (`POST /sales/`, `POST /products/`, `POST /bill/receipts/invoice/`) aceptan\
    \ un header `Idempotency-Key` elegido por el cliente. Reenviar el mismo request con la misma clave\
    \ dentro de las 24h reproduce la respuesta original en vez de crear un segundo recurso (la respuesta\
    \ trae `Idempotency-Replayed: true`); la misma clave con un body distinto devuelve 422.\n\n### Rate\
    \ limiting\nTodos los tokens de un mismo tenant comparten una ventana deslizante (10/s · 100/min ·\
    \ 3000/h · 20000/día). Al superarla, la respuesta es 429 con headers `X-RateLimit-*` y `Retry-After`.\n\
    \n### Modelo de respuesta\nToda respuesta exitosa tiene la forma `{\"success\": true, \"data\": ...,\
    \ \"message\"?: ..., \"_links\"?: {...}}`. Todo error tiene la forma `{\"success\": false, \"error\"\
    : \"...\", \"code\": \"...\"}` — `code` es estable y apto para switch/case, `error` es para mostrar.\n\
    \n### Confianza y disponibilidad\nSeguridad: https://yo-facturo.com/seguridad/ · Confiabilidad: https://yo-facturo.com/confiabilidad/\
    \ · DPA: https://yo-facturo.com/legal/dpa/ · SLA: https://yo-facturo.com/legal/sla/ · Estado del servicio:\
    \ https://status.yo-facturo.com\n\n## Cobertura de este spec\n\nDocumentado con detalle completo (request/response\
    \ tipados): **Productos**,\n**Clientes**, **Ventas**, **Facturación** (emisión/nota de crédito/nota\
    \ de\ndébito/autorización/anulación de comprobantes AFIP), **Cuenta corriente**,\n**Webhooks salientes**\
    \ y **Sandbox**.\n\nDocumentado con un esquema genérico (`GenericEntity`, `additionalProperties:\n\
    true`) pero con las rutas, scopes y métodos REALES: Categorías, Servicios,\nAlquileres, Variantes/Opciones\
    \ de producto, Perfiles de precio, Promociones,\nPOS, Caja registradora, Metas de venta, Pedidos,\
    \ Presupuestos/Cotizaciones,\nFacturas de compra, Remitos, Proveedores, Gastos, Insumos, CRM (tareas,\n\
    recordatorios, pipelines, oportunidades, segmentos, plantillas,\ncomunicaciones), Beneficios/Recompensas,\
    \ Turnos, Contratos, Métodos de pago,\nAsientos contables y Cuentas contables.\n\n**Deferred / not\
    \ yet in this spec** (endpoints reales que existen y son\nalcanzables con un API token, pero quedaron\
    \ fuera de esta primera versión —\ncandidatos para una v1.1):\n- Envíos (`/shipping/*`): ~30 endpoints\
    \ (proveedores, envíos, cotizaciones,\n  tracking) con `shipping:read`/`shipping:write` — forma no\
    \ estandar (no sigue\n  el patrón CRUD create/list de 5 rutas).\n- Servicio en campo (`/field-service/work-orders/*`):\
    \ CRUD + `cancel`,\n  `generate-sale`, `emit-remito`, `emit-invoice` con `field_service:read`/`write`.\n\
    - Sub-operaciones de venta que SOLO aceptan sesión JWT (no API token todavía):\n  `/sales/{id}/refund/`,\
    \ `/sales/{id}/cancel/`, `/sales/{id}/credit_note/`,\n  `/sales/{id}/payments/`.\n- Diagnóstico/utilidad\
    \ de facturación: `/bill/receipts/doctor/`,\n  `/bill/receipts/wsmtxca/diagnose/`, `/bill/receipts/test-environment/`,\n\
    \  `/bill/receipts/preview-type/`, `/bill/receipts/validate-type/*`,\n  `/bill/receipts/notes/*`,\
    \ `/bill/receipts/{id}/send-email/`,\n  PUT/PATCH de comprobante.\n- Import/export (Excel/CSV) por\
    \ entidad: `/{entity}/import/`,\n  `/{entity}/export/`, `/{entity}/import/template/` — autenticados\
    \ solo por\n  JWT en la mayoría de entidades.\n- SCIM 2.0 (`scim:provision`) y MCP (`POST /api/v1/mcp`)\
    \ — protocolos propios,\n  no HTTP REST convencional; se documentarán en specs separadas."
  contact:
    name: YoFacturo API Support
    email: api@yo-facturo.com
    url: https://yo-facturo.com/seguridad/
  license:
    name: Proprietary
    url: https://yo-facturo.com/legal/terms-and-conditions/
