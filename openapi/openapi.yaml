  /bill/receipts/authorize/{comprobante_id}/:
    post:
      tags:
      - Facturación
      summary: Autorizar comprobante (obtener CAE)
      operationId: authorize_comprobante
      description: 'Envía a AFIP un comprobante creado en borrador y obtiene su CAE. Con un token `yf_test_*`
        (sandbox) este endpoint no llama a AFIP: persiste un comprobante simulado (`simulated: true`,
        `livemode: false`, un CAE sintético) en la base sandbox aislada del tenant. Requiere scope `invoices:write`.'
      security:
      - ApiKeyHeader: []
      - ApiKeyBearer: []
      parameters:
      - name: comprobante_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Comprobante autorizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                    example: true
                  data:
                    $ref: '#/components/schemas/Comprobante'
                  message:
                    type: string
                  _links:
