                - integer
                - 'null'
                minimum: 1
              price:
                type:
                - number
                - 'null'
                minimum: 0
              discount_percentage:
                type:
                - number
                - 'null'
                minimum: 0
                maximum: 100
        marketplace_attributes:
          type: object
          description: 'Atributos por marketplace, con los ids nativos de esa plataforma (ej. ML: GENDER,
            GARMENT_TYPE).'
