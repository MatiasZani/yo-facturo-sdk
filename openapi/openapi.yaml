            type: array
            items:
              type: object
              required:
              - id
              - value
              properties:
                id:
                  type: string
                value:
                  type: string
      additionalProperties: true
    ProductUpdate:
      type: object
      description: Mismos campos que ProductCreate; todos opcionales (PUT parcial — solo se actualizan
        los campos enviados).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Notebook 15"
        description:
          type: string
        sku:
          type: string
        barcode:
          type: string
        category_id:
          type: string
        base_price:
          type: number
          minimum: 0
          maximum: 999999999999.99
          example: 450000
        cost:
          type: number
          minimum: 0
          maximum: 999999999999.99
        track_stock:
          type: boolean
          default: false
        stock:
          type: number
          minimum: 0
          maximum: 999999999
          description: Fraccionario para productos vendidos por peso (kg/g).
        min_stock:
          type: number
          minimum: 0
          maximum: 999999999
        manage_batches:
          type: boolean
        unit:
          type: string
          example: unidad
        status:
          type: string
          enum:
          - draft
          - active
          - paused
          - archived
        images:
          type: array
          items:
            type: string
            format: uri
        attributes:
          type: object
          additionalProperties: true
        brand:
          type: string
          maxLength: 120
        model:
          type: string
          maxLength: 120
        tags:
          type: array
          items:
            type: string
        tax_rate:
          type: number
          minimum: 0
          maximum: 100
          description: Alícuota de IVA en %.
        weight:
          type: number
          minimum: 0
        dimensions:
          type: object
        featured:
          type: boolean
        warehouse_id:
          type: string
          description: Depósito al que imputar el stock inicial (multi-almacén). Ausente = depósito default.
        variants:
          oneOf:
          - type: array
          - type: object
          description: 'Variantes del producto. Se acepta objeto `{sku: {...}}` (se normaliza a array
            preservando la key como id) o array directo.'
        has_variants:
          type: boolean
        quantity_price_tiers:
          type: array
          items:
            type: object
            required:
            - min_quantity
            properties:
              min_quantity:
                type: integer
                minimum: 1
              max_quantity:
                type:
                - integer
                - 'null'
                minimum: 1
              price:
                type:
                - number
                - 'null'
                minimum: 0
              discount_percentage:
                type:
                - number
                - 'null'
                minimum: 0
                maximum: 100
        marketplace_attributes:
          type: object
          description: 'Atributos por marketplace, con los ids nativos de esa plataforma (ej. ML: GENDER,
            GARMENT_TYPE).'
          additionalProperties:
            type: array
            items:
              type: object
              required:
              - id
              - value
              properties:
                id:
                  type: string
                value:
                  type: string
      additionalProperties: true
    Customer:
      allOf:
      - $ref: '#/components/schemas/GenericEntity'
      - type: object
        properties:
          name:
            type: string
          email:
            type: string
          phone:
            type: string
          document_type:
            type: string
          document_number:
            type: string
          status:
            type: string
          credit_limit:
            type:
            - number
            - 'null'
    CustomerCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: Juan Pérez
        email:
          type: string
          format: email
        customer_email:
          type: string
          format: email
        phone:
          type: string
          example: '+5491122334455'
        document_type:
          type: string
          enum:
          - ''
          - dni
          - cuit
          - cuil
          - passport
          - cedula
          - other
        document_number:
          type: string
          maxLength: 20
          example: '20345678901'
        address:
          oneOf:
          - type: string
          - type: object
          - type: 'null'
        status:
          type: string
          enum:
          - active
          - inactive
          - blocked
          default: active
        notes:
          type: string
          maxLength: 1000
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        credit_limit:
          type:
          - number
          - 'null'
          minimum: 0
          description: Límite de cuenta corriente. `null`/ausente = crédito ilimitado.
        credit_blocked:
          type: boolean
      additionalProperties: true
    CustomerUpdate:
      type: object
      description: Mismos campos que CustomerCreate, todos opcionales.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: Juan Pérez
        email:
          type: string
          format: email
        customer_email:
          type: string
          format: email
        phone:
          type: string
          example: '+5491122334455'
        document_type:
          type: string
          enum:
          - ''
          - dni
          - cuit
          - cuil
          - passport
          - cedula
          - other
        document_number:
          type: string
          maxLength: 20
          example: '20345678901'
        address:
          oneOf:
          - type: string
          - type: object
          - type: 'null'
        status:
          type: string
          enum:
          - active
          - inactive
          - blocked
          default: active
        notes:
          type: string
          maxLength: 1000
        tags:
          type: array
          items:
            type: string
        custom_fields:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        credit_limit:
          type:
          - number
          - 'null'
          minimum: 0
          description: Límite de cuenta corriente. `null`/ausente = crédito ilimitado.
        credit_blocked:
          type: boolean
      additionalProperties: true
    SaleItem:
      type: object
      description: Ítem de venta. La forma exacta depende de si referencia un producto/servicio/alquiler
        existente o es un ítem libre.
      properties:
        product_id:
          type: string
        publication_id:
          type: string
        publication_type:
          type: string
          enum:
          - product
          - services
          - rental
        name:
          type: string
        quantity:
          type: number
          minimum: 0
        price:
          type: number
          minimum: 0
        variant_id:
          type: string
        discount_percent:
          type: number
          minimum: 0
          maximum: 100
        group_id:
          type:
          - string
          - 'null'
      additionalProperties: true
    Sale:
      allOf:
      - $ref: '#/components/schemas/GenericEntity'
      - type: object
        properties:
          customer_id:
            type: string
          items:
            type: array
            items:
              $ref: '#/components/schemas/SaleItem'
          subtotal:
            type: number
          total:
            type: number
          status:
            type: string
          payment_status:
            type: string
          sale_origin:
            type: string
          invoice_id:
            type: string
            description: Id del comprobante AFIP asociado, si generate_invoice fue true.
    SaleCreate:
      type: object
      required:
      - items
      properties:
        customer_id:
          type: string
        customer:
          type: string
          description: 'Alternativa a customer_id: puede ser "no-customer" o un id.'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SaleItem'
        payment_method:
          type: string
        notes:
          type: string
        requires_shipping:
          type: boolean
        sale_origin:
          type: string
          enum:
          - manual
          - pos
          - ecommerce
          - order
          - budget
          - contract
          - rental_booking
          - appointment
          - mercadolibre
          - tiendanube
          - shopify
          - subscription
          default: manual
        shipping_method:
          type: string
        shipping_cost:
          type: number
          minimum: 0
        shipping_address:
          type: object
          additionalProperties: true
        generate_invoice:
          type: boolean
          description: Si true, dispara la emisión del comprobante AFIP asociado tras crear la venta.
        subtotal:
          type: number
          minimum: 0
        total:
          type: number
          minimum: 0
        tax_type:
          type: string
        tax_rate:
          type: number
          minimum: 0
          maximum: 100
        discount_type:
          type: string
        discount_rate:
          type: number
          minimum: 0
          maximum: 100
        payment:
          type: object
          additionalProperties: true
        warehouse_id:
          type: string
          description: Depósito desde el que se descuenta el stock.
        sales_point_id:
          type: string
          description: Punto de venta fiscal (determina el PV de la factura si se emite).
      additionalProperties: true
    InvoiceCreateRequest:
      type: object
      description: 'Datos del comprobante a emitir. El tipo (Factura A/B/C) se infiere de la condición
        de IVA del emisor si `tipo_comprobante` se omite. En un token `yf_test_*` este endpoint NUNCA
        llama a AFIP: guarda un comprobante simulado con un CAE sintético (`simulated: true`, `livemode:
        false`) en la base sandbox del tenant.'
      required:
      - tipo_documento
      - numero_documento
      - items
      properties:
        tipo_comprobante:
          type: integer
          description: 'Código AFIP del tipo de comprobante (6=Factura B, 1=Factura A, 11=Factura C, ...).
            Opcional: se infiere si se omite.'
          example: 6
        punto_venta:
          type: integer
          minimum: 1
          example: 1
        tipo_documento:
          type: integer
          description: Código AFIP del tipo de documento del receptor (80=CUIT, 96=DNI, 99=Consumidor
            Final).
          example: 96
        numero_documento:
          type: string
          example: '30712345678'
        razon_social:
          type: string
          example: Consumidor Final
        domicilio:
          type: string
        condicion_iva_receptor:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              descripcion:
                type: string
              cantidad:
                type: number
                minimum: 0
              precio_unitario:
                type: number
                minimum: 0
              alicuota_iva:
                type: string
                description: Código AFIP de alícuota (5=21%, 4=10.5%, 3=0%, ...).
        importe_total:
          type: number
          minimum: 0
        customer_id:
          type: string
          description: Id del cliente en YoFacturo (alternativa a mandar los datos fiscales sueltos).
        sale_id:
          type: string
          description: Venta de origen, si corresponde.
        ambiente:
          type: string
          enum:
          - production
          - testing
          default: production
          description: Ambiente AFIP real a usar (no confundir con el modo sandbox del token, que directamente
            evita la llamada).
        autorizar:
          type: boolean
          default: false
          description: Si true, dispara la autorización (obtención del CAE) en background inmediatamente
            después de crear el borrador.
      additionalProperties: true
    NoteCreateRequest:
      type: object
      description: Nota de crédito/débito asociada a un comprobante existente.
      required:
      - comprobante_asociado_id
      - items
      properties:
        comprobante_asociado_id:
          type: string
          description: Id del comprobante (factura) que esta nota ajusta.
        motivo:
          type: string
          example: Devolución parcial de mercadería
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        importe_total:
          type: number
          minimum: 0
        ambiente:
          type: string
          enum:
          - production
          - testing
          default: production
      additionalProperties: true
    Comprobante:
      type: object
      properties:
        id:
          type: string
        tipo_comprobante:
          type: integer
        punto_venta:
          type: integer
        numero_comprobante:
          type: integer
        cae:
          type: string
          description: Código de Autorización Electrónico de AFIP (o sintético en sandbox).
        cae_vencimiento:
          type: string
          example: '20261015'
        fecha_comprobante:
          type: string
          example: '20260805'
        estado:
          type: string
          example: autorizado
        ambiente:
          type: string
          example: production
        livemode:
          type: boolean
          description: false cuando el comprobante fue emitido por un token yf_test_* (simulado, sin AFIP
            real).
        simulated:
          type: boolean
          description: 'true en modo sandbox: el CAE tiene el formato correcto pero NO es válido para
            un comprobante fiscal real.'
        iva_handling:
          type: object
          properties:
            incluye_iva_discriminado:
              type: boolean
            tipo_comprobante_nombre:
              type: string
            condicion_fiscal_emisor:
              type: string
        idempotent_replay:
          type: boolean
          description: true si esta respuesta es la reproducción de un request anterior idéntico.
      additionalProperties: true
    CurrentAccount:
      allOf:
      - $ref: '#/components/schemas/GenericEntity'
      - type: object
        properties:
          entity_type:
            type: string
            enum:
            - customer
            - supplier
          entity_id:
            type: string
          entity_name:
            type: string
          balance:
            type: number
            description: Saldo actual (positivo = el cliente/proveedor nos debe).
          credit_limit:
            type: number
          payment_terms_days:
            type: integer
          status:
            type: string
    CurrentAccountCreate:
      type: object
      required:
      - entity_type
      - entity_id
      - entity_name
      properties:
        entity_type:
          type: string
          enum:
          - customer
          - supplier
        entity_id:
          type: string
          description: Id del cliente o proveedor dueño de esta cuenta corriente.
        entity_name:
          type: string
        credit_limit:
          type: number
          minimum: 0
          maximum: 999999999999.99
          default: 0
        payment_terms_days:
          type: integer
          default: 30
    PaymentCreate:
      type: object
      required:
      - amount
      - payment_method
      - reference
      description: 'El pago se registra en estado pendiente; NO se aplica automáticamente contra facturas
        salvo `auto_apply: true`.'
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999.99
        payment_method:
          type: string
          example: credit_card
        reference:
          type: string
          example: TRANS-123
        payment_date:
          type: string
          format: date-time
        auto_apply:
          type: boolean
          default: false
          description: Si true, reconcilia automáticamente el pago contra facturas pendientes (FIFO).
        cash_register_id:
          type: string
          description: Caja abierta a la que imputar la cobranza (opcional; omitido = no pasó por una
            caja).
    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        description:
          type: string
        events:
          type: array
          items:
            type: string
        mode:
          type: string
          enum:
          - live
          - test
          description: Derivado de si el endpoint se creó con un token yf_live_* o yf_test_*.
        secret_prefix:
          type: string
          description: Primeros caracteres del secreto (whsec_...), para identificarlo sin volver a mostrarlo
            entero.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        rotated_at:
          type:
          - string
          - 'null'
          format: date-time
        last_delivery_at:
          type:
          - string
          - 'null'
          format: date-time
        last_delivery_status:
          type:
          - string
          - 'null'
    WebhookEndpointCreate:
      type: object
      required:
      - url
      - events
      properties:
        url:
          type: string
          format: uri
          description: URL https/http pública. Se rechaza si resuelve a una IP privada/loopback/link-local
            (protección SSRF).
        events:
          type: array
          minItems: 1
          items:
            type: string
          description: Uno o más event_type del catálogo (ver GET /webhooks/events).
        description:
          type: string
    WebhookEndpointCreated:
      allOf:
      - $ref: '#/components/schemas/WebhookEndpoint'
      - type: object
        properties:
          secret:
            type: string
            description: 'Secreto completo `whsec_...` usado para firmar cada delivery (HMAC-SHA256).
              Se devuelve UNA SOLA VEZ acá — solo persiste su forma cifrada. Si se pierde, no hay forma
              de recuperarlo: hay que borrar el endpoint y crear uno nuevo.'
            example: whsec_9f8a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a
    WebhookEvent:
      type: object
      properties:
        event_type:
          type: string
          example: invoice.authorized
        description:
          type: string
          example: AFIP autorizó el comprobante y le asignó CAE
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
        endpoint_id:
          type: string
        event_type:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: El body exacto enviado (mismo que firma X-YF-Signature).
        status:
          type: string
          enum:
          - pending
          - retrying
          - success
          - failed
        attempt_count:
          type: integer
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryAttempt'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        delivered_at:
          type:
          - string
          - 'null'
          format: date-time
        next_retry_at:
          type:
          - string
          - 'null'
          format: date-time
    WebhookDeliveryAttempt:
      type: object
      properties:
        attempted_at:
          type: string
          format: date-time
        status_code:
          type:
          - integer
          - 'null'
        response_body:
          type: string
          description: Truncado a 2000 caracteres.
        error:
          type:
          - string
          - 'null'
        duration_ms:
          type: number
    SandboxResetResponse:
      type: object
      properties:
        reset:
          type: boolean
          example: true
        sandbox_db:
          type: string
          description: Nombre físico de la base de datos sandbox que se vació.
          example: db_7165cccd__sandbox
        livemode:
          type: boolean
          enum:
          - false
