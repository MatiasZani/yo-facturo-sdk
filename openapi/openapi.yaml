- url: https://api.yo-facturo.com/api/v1
  description: Producción
tags:
- name: Catálogo
  description: Productos, servicios, alquileres, categorías, variantes, perfiles de precio y promociones.
- name: Ventas
  description: Ventas, punto de venta, caja registradora, metas de venta, presupuestos y pedidos.
- name: Facturación
  description: Comprobantes electrónicos AFIP (facturas, notas de crédito/débito), facturas de compra
    y remitos.
- name: Compras
  description: Proveedores, gastos e insumos.
- name: Clientes
  description: Clientes, cuenta corriente, CRM y programa de beneficios.
- name: Operaciones
  description: Turnos, contratos, métodos de pago, envíos y servicio en campo.
- name: Contabilidad
  description: Plan de cuentas y libro diario.
- name: Webhooks
  description: Suscripción a eventos salientes (HTTP) y su historial de entregas.
- name: Sandbox
  description: Gestión de la base de datos de pruebas aislada de un token yf_test_*.
